  <rect x="628" y="404" width="128" height="56" rx="8" fill="#0E2A33" stroke="#33C2CC" stroke-opacity=".35"/>
  <text x="640" y="424" fill="#33C2CC" font-size="8">NEXT SESSION</text>
  <text x="640" y="442" fill="#DDE2F5" font-size="10">Thu · 19:00 IST</text>
