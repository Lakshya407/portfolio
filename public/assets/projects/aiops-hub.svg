  <g font-size="10">
    <text x="256" y="314" fill="#57DB96">✓</text>
    <text x="276" y="314" fill="#6E7695" text-decoration="line-through">Ship structured logs to Loki</text>
    <text x="256" y="340" fill="#57DB96">✓</text>
    <text x="276" y="340" fill="#6E7695" text-decoration="line-through">Write PromQL for SLO burn rate</text>
    <text x="256" y="366" fill="#57DB96">✓</text>
