  <rect x="236" y="62" width="540" height="174" rx="10" fill="#101630" stroke="#232C4D"/>
  <text x="256" y="88" fill="#DDE2F5" font-size="12" font-weight="700">Progress</text>
  <text x="256" y="118" fill="#7D86A8" font-size="10">MONTH 4 OF 6</text>
  <text x="256" y="156" fill="#FFFFFF" font-size="34" font-weight="700">58%</text>
  <text x="256" y="180" fill="#8B93B0" font-size="10">14 of 24 weeks complete</text>

  <g transform="translate(660 148)">
